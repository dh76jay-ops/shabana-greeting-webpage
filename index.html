<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Shabana ji</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family: Georgia, "Times New Roman", serif;
      color: #fffaf2;

      /* Your moon photo */
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.25),
          rgba(0, 0, 0, 0.25)
        ),
        url("background.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .card {
      width: min(100%, 620px);
      padding: 64px 32px;
      text-align: center;

      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .hello {
      margin: 0;
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 400;
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .line {
      width: 55px;
      height: 1px;
      margin: 24px auto;
      background: rgba(255, 250, 242, 0.75);
    }

    .name {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .message {
      margin: 18px 0 0;
      font-family: Arial, sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.5px;
      color: rgba(255, 250, 242, 0.9);
    }

    .sparkle {
      display: inline-block;
      margin-left: 6px;
      color: #f5d58a;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 48px 20px;
        border-radius: 20px;
      }

      .hello {
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <h1 class="hello">Hello</h1>

    <div class="line"></div>

    <h2 class="name">Good morning Shabana ji</h2>

    <p class="message">
      All the best for your exam
      <span class="sparkle">✦</span>
    </p>
  </main>

</body>
</html>
